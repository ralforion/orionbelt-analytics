# Pre-commit hooks for code quality and security
#
# The Python tools run from the project venv (`uv run`), so their versions are
# the ones in uv.lock -- the same as CI -- and a Dependabot bump reaches the
# hooks with nothing else to edit. Remote `rev:` pins could not follow the lock
# and drifted until three of these hooks no longer ran. Run `uv sync` first.
repos:
  - repo: local
    hooks:
      # Formatting and imports, as CI's quality job checks them.
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        files: ^(src/|tests/|server\.py$)
      - id: isort
        name: isort
        entry: uv run isort --filter-files
        language: system
        types: [python]
        files: ^(src/|tests/|server\.py$)

      # Lint with ruff, CI's linter (rule selection in pyproject.toml).
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        files: ^(src/|tests/|server\.py$)

      # Strict type check of the whole package, as CI's typecheck job runs it:
      # checking only the changed files would resolve imports differently.
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/.*\.py$

      # Security lint with the [tool.bandit] skips from pyproject.toml. Blocks
      # only on medium-or-higher severity *and* confidence. The rest (today:
      # low-confidence B608 string-built SQL, low-severity B105/B107) needs a
      # human: review `bandit -c pyproject.toml -r src/` on SQL or credential
      # changes.
      - id: bandit
        name: bandit
        entry: uv run bandit -q -c pyproject.toml -ll -ii -r src/
        language: system
        pass_filenames: false
        files: ^src/.*\.py$

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
        exclude: tests/

  # Security vulnerability scanning
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.25.0
    hooks:
      - id: ggshield
        language: python
        stages: [pre-commit]

  # Third-party attribution: keep THIRD_PARTY_NOTICES.md in step with the
  # locked production tree. Scoped to the files that can change the dependency
  # set, so it does not run (and does not need the venv) on an ordinary commit.
  - repo: local
    hooks:
      - id: third-party-notices
        name: third-party notices
        entry: uv run python scripts/gen-third-party-notices.py --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|scripts/gen-third-party-notices\.py)$

# --- Measures of the "many" side, through many-to-one lookups -----------------

[[case]]
id = "revenue-per-region"
pattern = "many-to-one"
question = "Revenue (quantity times price of items sold) per region."
expect = "right"
sql = """
SELECT r.name, SUM(oi.quantity * oi.price) AS revenue
FROM order_items oi
JOIN orders o ON o.id = oi.order_id
JOIN customers c ON c.id = o.customer_id
JOIN regions r ON r.id = c.region_id
GROUP BY r.name
"""
truth = """
SELECT r.name, SUM(t.v) FROM (
    SELECT o.customer_id, oi.quantity * oi.price AS v
    FROM order_items oi JOIN orders o ON o.id = oi.order_id
) t JOIN customers c ON c.id = t.customer_id JOIN regions r ON r.id = c.region_id
GROUP BY r.name
"""

[[case]]
id = "order-value-per-region"
pattern = "many-to-one"
question = "Total order value per region."
expect = "right"
sql = """
SELECT r.name, SUM(o.total) AS order_value
FROM orders o
JOIN customers c ON c.id = o.customer_id
JOIN regions r ON r.id = c.region_id
GROUP BY r.name
"""
truth = """
SELECT r.name, (SELECT SUM(o.total) FROM orders o JOIN customers c ON c.id = o.customer_id
                WHERE c.region_id = r.id)
FROM regions r
WHERE EXISTS (SELECT 1 FROM orders o JOIN customers c ON c.id = o.customer_id
              WHERE c.region_id = r.id)
"""

[[case]]
id = "quantity-per-category"
pattern = "many-to-one"
question = "Units sold per product category."
expect = "right"
sql = """
SELECT p.category, SUM(oi.quantity) AS units
FROM order_items oi
JOIN products p ON p.id = oi.product_id
GROUP BY p.category
"""
truth = """
SELECT p.category, (SELECT SUM(quantity) FROM order_items oi
                    JOIN products q ON q.id = oi.product_id WHERE q.category = p.category)
FROM (SELECT DISTINCT category FROM products
      WHERE id IN (SELECT product_id FROM order_items)) p
"""

[[case]]
id = "credit-limit-per-region"
pattern = "many-to-one"
question = "Total credit limit of customers per region."
expect = "right"
sql = """
SELECT r.name, SUM(c.credit_limit) AS credit
FROM customers c
JOIN regions r ON r.id = c.region_id
GROUP BY r.name
"""
truth = """
SELECT r.name, (SELECT SUM(credit_limit) FROM customers c WHERE c.region_id = r.id)
FROM regions r
WHERE EXISTS (SELECT 1 FROM customers c WHERE c.region_id = r.id)
"""

# --- One row per order in the data, many allowed by the schema ----------------

[[case]]
id = "order-value-and-shipping-per-customer"
pattern = "fan-trap (latent)"
question = "Per customer: total order value and total shipping cost."
expect = "right"
sql = """
SELECT o.customer_id, SUM(o.total) AS order_value, SUM(s.cost) AS shipping
FROM orders o
JOIN shipments s ON s.order_id = o.id
GROUP BY o.customer_id
"""
truth = """
WITH v AS (SELECT customer_id, SUM(total) AS t FROM orders
           WHERE id IN (SELECT order_id FROM shipments) GROUP BY customer_id),
     s AS (SELECT o.customer_id, SUM(s.cost) AS c FROM shipments s
           JOIN orders o ON o.id = s.order_id GROUP BY o.customer_id)
SELECT v.customer_id, v.t, s.c FROM v JOIN s ON s.customer_id = v.customer_id
"""

# --- Many to many, through a bridge table --------------------------------------

[[case]]
id = "credits-per-student"
pattern = "bridge, grouped by key"
question = "Credits each student is enrolled for."
expect = "right"
sql = """
SELECT s.id, SUM(c.credits) AS credits
FROM students s
JOIN student_courses sc ON sc.student_id = s.id
JOIN courses c ON c.id = sc.course_id
GROUP BY s.id
"""
truth = """
SELECT sc.student_id, SUM(c.credits) FROM student_courses sc
JOIN courses c ON c.id = sc.course_id GROUP BY sc.student_id
"""

[[case]]
id = "credits-per-student-group-by-all"
pattern = "bridge, grouped by key"
question = "Credits each student is enrolled for."
expect = "right"
sql = """
SELECT s.id, SUM(c.credits) AS credits
FROM students s
JOIN student_courses sc ON sc.student_id = s.id
JOIN courses c ON c.id = sc.course_id
GROUP BY ALL
"""
truth = """
SELECT sc.student_id, SUM(c.credits) FROM student_courses sc
JOIN courses c ON c.id = sc.course_id GROUP BY sc.student_id
"""

[[case]]
id = "credits-per-student-name"
pattern = "bridge, grouped by non-key"
question = "Credits each student is enrolled for, listed by name."
expect = "wrong"
sql = """
SELECT s.name, SUM(c.credits) AS credits
FROM students s
JOIN student_courses sc ON sc.student_id = s.id
JOIN courses c ON c.id = sc.course_id
GROUP BY s.name
"""
truth = """
SELECT s.name, SUM(t.credits) FROM students s
JOIN (SELECT sc.student_id, SUM(c.credits) AS credits FROM student_courses sc
      JOIN courses c ON c.id = sc.course_id GROUP BY sc.student_id) t
  ON t.student_id = s.id
GROUP BY s.id, s.name
"""


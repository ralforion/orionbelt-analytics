# --- Two "many" sides joined to one "one" side: the chasm trap ----------------

[[case]]
id = "ordered-and-paid-per-customer"
pattern = "chasm-trap"
question = "Per customer: value of the items they ordered and the amount they paid."
expect = "wrong"
sql = """
SELECT o.customer_id,
    SUM(oi.quantity * oi.price) AS ordered,
    SUM(p.amount) AS paid
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
JOIN payments p ON p.order_id = o.id
GROUP BY o.customer_id
"""
truth = """
WITH ordered AS (
    SELECT o.customer_id, SUM(oi.quantity * oi.price) AS v
    FROM order_items oi JOIN orders o ON o.id = oi.order_id GROUP BY o.customer_id
), paid AS (
    SELECT o.customer_id, SUM(p.amount) AS v
    FROM payments p JOIN orders o ON o.id = p.order_id GROUP BY o.customer_id
)
SELECT ordered.customer_id, ordered.v, paid.v
FROM ordered JOIN paid ON paid.customer_id = ordered.customer_id
"""

[[case]]
id = "ordered-and-paid-per-customer-separately"
pattern = "pre-aggregation"
question = "Per customer: value of the items they ordered and the amount they paid."
expect = "right"
sql = """
WITH ordered AS (
    SELECT o.customer_id, SUM(oi.quantity * oi.price) AS v
    FROM order_items oi JOIN orders o ON o.id = oi.order_id
    GROUP BY o.customer_id
), paid AS (
    SELECT o.customer_id, SUM(p.amount) AS v
    FROM payments p JOIN orders o ON o.id = p.order_id
    GROUP BY o.customer_id
)
SELECT ordered.customer_id, ordered.v AS ordered, paid.v AS paid
FROM ordered JOIN paid ON paid.customer_id = ordered.customer_id
"""
truth = """
WITH ordered AS (
    SELECT o.customer_id, SUM(oi.quantity * oi.price) AS v
    FROM order_items oi JOIN orders o ON o.id = oi.order_id GROUP BY o.customer_id
), paid AS (
    SELECT o.customer_id, SUM(p.amount) AS v
    FROM payments p JOIN orders o ON o.id = p.order_id GROUP BY o.customer_id
)
SELECT ordered.customer_id, ordered.v, paid.v
FROM ordered JOIN paid ON paid.customer_id = ordered.customer_id
"""

[[case]]
id = "ordered-and-paid-per-customer-union-all"
pattern = "union-all"
question = "Per customer: value of the items they ordered and the amount they paid."
expect = "right"
sql = """
SELECT customer_id, SUM(ordered) AS ordered, SUM(paid) AS paid
FROM (
    SELECT o.customer_id, oi.quantity * oi.price AS ordered, 0 AS paid
    FROM order_items oi JOIN orders o ON o.id = oi.order_id
    UNION ALL
    SELECT o.customer_id, 0 AS ordered, p.amount AS paid
    FROM payments p JOIN orders o ON o.id = p.order_id
) movements
GROUP BY customer_id
"""
truth = """
WITH ordered AS (
    SELECT o.customer_id, SUM(oi.quantity * oi.price) AS v
    FROM order_items oi JOIN orders o ON o.id = oi.order_id GROUP BY o.customer_id
), paid AS (
    SELECT o.customer_id, SUM(p.amount) AS v
    FROM payments p JOIN orders o ON o.id = p.order_id GROUP BY o.customer_id
)
SELECT ordered.customer_id, ordered.v, paid.v
FROM ordered JOIN paid ON paid.customer_id = ordered.customer_id
"""

# --- One fact pointing at another: returns of order lines --------------------

[[case]]
id = "sold-and-refunded-per-category"
pattern = "fact-to-fact"
question = "Per product category: the value sold and the value refunded."
expect = "wrong"
sql = """
SELECT p.category,
    SUM(oi.quantity * oi.price) AS sold,
    SUM(r.refund) AS refunded
FROM order_items oi
JOIN products p ON p.id = oi.product_id
LEFT JOIN returns r ON r.order_item_id = oi.id
GROUP BY p.category
"""
truth = """
WITH sold AS (
    SELECT p.category, SUM(oi.quantity * oi.price) AS v
    FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY p.category
), refunded AS (
    SELECT p.category, SUM(r.refund) AS v
    FROM returns r
    JOIN order_items oi ON oi.id = r.order_item_id
    JOIN products p ON p.id = oi.product_id
    GROUP BY p.category
)
SELECT sold.category, sold.v, refunded.v
FROM sold LEFT JOIN refunded ON refunded.category = sold.category
"""

[[case]]
id = "sold-and-refunded-per-category-legs"
pattern = "union-all"
question = "Per product category: the value sold and the value refunded."
expect = "right"
sql = """
WITH legs AS (
    SELECT p.category, oi.quantity * oi.price AS sold, NULL AS refunded
    FROM order_items oi
    JOIN products p ON p.id = oi.product_id
    UNION ALL
    SELECT p.category, NULL, r.refund
    FROM returns r
    JOIN order_items oi ON oi.id = r.order_item_id
    JOIN products p ON p.id = oi.product_id
)
SELECT category, SUM(sold) AS sold, SUM(refunded) AS refunded
FROM legs
GROUP BY category
"""
truth = """
WITH sold AS (
    SELECT p.category, SUM(oi.quantity * oi.price) AS v
    FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY p.category
), refunded AS (
    SELECT p.category, SUM(r.refund) AS v
    FROM returns r
    JOIN order_items oi ON oi.id = r.order_item_id
    JOIN products p ON p.id = oi.product_id
    GROUP BY p.category
)
SELECT sold.category, sold.v, refunded.v
FROM sold LEFT JOIN refunded ON refunded.category = sold.category
"""

[[case]]
id = "value-of-returned-lines-join"
pattern = "fact-to-fact"
question = "Value sold on the order lines that were returned."
expect = "wrong"
sql = """
SELECT SUM(oi.quantity * oi.price)
FROM order_items oi
JOIN returns r ON r.order_item_id = oi.id
"""
truth = """
SELECT SUM(quantity * price) FROM order_items
WHERE id IN (SELECT order_item_id FROM returns)
"""

[[case]]
id = "value-of-returned-lines-semi-join"
pattern = "semi-join"
question = "Value sold on the order lines that were returned."
expect = "right"
sql = """
SELECT SUM(oi.quantity * oi.price)
FROM order_items oi
WHERE EXISTS (SELECT 1 FROM returns r WHERE r.order_item_id = oi.id)
"""
truth = """
SELECT SUM(quantity * price) FROM order_items
WHERE id IN (SELECT order_item_id FROM returns)
"""

[[case]]
id = "refunds-per-customer-through-the-sale"
pattern = "lookup chain"
question = "Per customer: the value refunded."
expect = "right"
sql = """
SELECT o.customer_id, SUM(r.refund) AS refunded
FROM returns r
JOIN order_items oi ON oi.id = r.order_item_id
JOIN orders o ON o.id = oi.order_id
GROUP BY o.customer_id
"""
truth = """
SELECT o.customer_id, SUM(r.refund)
FROM orders o, order_items oi, returns r
WHERE oi.order_id = o.id AND r.order_item_id = oi.id
GROUP BY o.customer_id
"""


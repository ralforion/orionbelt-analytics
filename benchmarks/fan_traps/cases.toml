[[case]]
id = "total-per-customer-left-joins"
pattern = "fan-trap"
question = "Per customer, including those without orders: total order value and number of items."
expect = "wrong"
sql = """
SELECT c.id, COALESCE(SUM(o.total), 0) AS order_value, COUNT(oi.id) AS items
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
LEFT JOIN order_items oi ON oi.order_id = o.id
GROUP BY c.id
"""

# Fan-trap benchmark cases: queries that run, name only real tables and
# columns, and still may return the wrong number.
#
# Each case is a question, a candidate query someone (or a model) might write
# for it, and a "truth" query that answers the question correctly. Whether a
# candidate is wrong is not asserted by hand: the benchmark runs both on the
# same data and calls the candidate wrong when the numbers differ. `expect`
# records what the data shows, so a case that stops showing it is noticed.
#
# Schema and data: scripts/bench_fan_traps.py. Run:
#     uv run python scripts/bench_fan_traps.py

# --- A measure of the "one" side, summed across a join to the "many" side -----

[[case]]
id = "total-per-customer-with-item-count"
pattern = "fan-trap"
question = "Per customer: total value of their orders that have items, and how many items they bought."
expect = "wrong"
sql = """
SELECT c.id, SUM(o.total) AS order_value, COUNT(oi.id) AS items
FROM customers c
JOIN orders o ON o.customer_id = c.id
JOIN order_items oi ON oi.order_id = o.id
GROUP BY c.id
"""
truth = """
WITH v AS (
    SELECT customer_id, SUM(total) AS t FROM orders
    WHERE id IN (SELECT order_id FROM order_items) GROUP BY customer_id
), n AS (
    SELECT o.customer_id, COUNT(*) AS n
    FROM order_items oi JOIN orders o ON o.id = oi.order_id GROUP BY o.customer_id
)
SELECT v.customer_id, v.t, n.n FROM v JOIN n ON n.customer_id = v.customer_id
"""

[[case]]
id = "total-per-customer-with-item-count-preaggregated"
pattern = "pre-aggregation"
question = "Per customer: total value of their orders that have items, and how many items they bought."
expect = "right"
sql = """
WITH items AS (
    SELECT order_id, COUNT(*) AS n FROM order_items GROUP BY order_id
)
SELECT c.id, SUM(o.total) AS order_value, SUM(i.n) AS items
FROM customers c
JOIN orders o ON o.customer_id = c.id
JOIN items i ON i.order_id = o.id
GROUP BY c.id
"""
truth = """
WITH v AS (
    SELECT customer_id, SUM(total) AS t FROM orders
    WHERE id IN (SELECT order_id FROM order_items) GROUP BY customer_id
), n AS (
    SELECT o.customer_id, COUNT(*) AS n
    FROM order_items oi JOIN orders o ON o.id = oi.order_id GROUP BY o.customer_id
)
SELECT v.customer_id, v.t, n.n FROM v JOIN n ON n.customer_id = v.customer_id
"""


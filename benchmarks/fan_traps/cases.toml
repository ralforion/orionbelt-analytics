    COALESCE((SELECT SUM(o.total) FROM orders o WHERE o.customer_id = c.id), 0),
    (SELECT COUNT(*) FROM order_items oi JOIN orders o ON o.id = oi.order_id
     WHERE o.customer_id = c.id)
FROM customers c
"""


[[case]]
id = "credit-limit-per-region-with-orders"
pattern = "fan-trap"
question = "Per region: total credit limit of customers who ordered, and their number of orders."
expect = "wrong"
sql = """
SELECT r.name, SUM(c.credit_limit) AS credit, COUNT(o.id) AS orders
FROM regions r
JOIN customers c ON c.region_id = r.id
JOIN orders o ON o.customer_id = c.id
GROUP BY r.name
"""
truth = """
WITH buyers AS (SELECT customer_id, COUNT(*) AS n FROM orders GROUP BY customer_id)
